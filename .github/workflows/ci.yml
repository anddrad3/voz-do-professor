name: Verificação do Voz do Professor
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: python3 -m unittest discover -s tests -p '*_test.py'
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
