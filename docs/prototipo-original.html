            const headerPostTitle = document.getElementById('header-post-title');

                singleContainer.classList.remove('hidden');

                headerFeed.classList.remove('opacity-100');

                    headerFeed.classList.remove('opacity-100');

                headerPost.classList.remove('opacity-100');

        function renderLocationModal() {
            const stateList = document.getElementById('state-list');
            const cityList = document.getElementById('city-list');
            const citySection = document.getElementById('city-section');
            const stateSection = document.getElementById('state-section');
            const currentStateBadge = document.getElementById('current-state-badge');
            
            // Renderiza Estados
            let statesHTML = `<button onclick="selectLocation('Nacional', 'Todas')" class="w-full text-left px-4 py-3 rounded-xl transition-colors text-[13px] ${State.location.state === 'Nacional' ? 'bg-brand-red/10 text-brand-red font-medium border border-brand-red/20' : 'hover:bg-white/5 text-white/70 border border-transparent'}">Todo o Brasil (Nacional)</button>`;
            
            for (const uf in LOCATIONS) {
                statesHTML += `<button onclick="pickState('${uf}')" class="w-full text-left px-4 py-3 rounded-xl transition-colors text-[13px] flex justify-between items-center ${State.location.state === uf ? 'bg-brand-red/10 text-brand-red font-medium border border-brand-red/20' : 'hover:bg-white/5 text-white/70 border border-transparent'}">
                    ${uf} <i data-lucide="chevron-right" class="w-4 h-4 opacity-30"></i>
                </button>`;

            stateList.innerHTML = statesHTML;

            // Renderiza Cidades ou Estados (Gestão do Step 1 / Step 2 no Mobile)
            if (State.location.state !== 'Nacional' && LOCATIONS[State.location.state]) {
                // Estado selecionado (Mostra Cidades)
                citySection.classList.remove('hidden');
                citySection.classList.add('flex', 'h-full');
                currentStateBadge.innerText = State.location.state;
                
                // No Mobile (Step 2): Esconder secção de estados
                stateSection.classList.remove('flex');
                stateSection.classList.add('hidden', 'sm:flex');

                let citiesHTML = `<button onclick="selectLocation('${State.location.state}', 'Todas')" class="w-full text-left px-4 py-3 rounded-xl transition-colors text-[13px] ${State.location.city === 'Todas' ? 'bg-brand-red/10 text-brand-red font-medium border border-brand-red/20' : 'hover:bg-white/5 text-white/70 border border-transparent'}">Todas as cidades</button>`;
                
                LOCATIONS[State.location.state].forEach(city => {
                    citiesHTML += `<button onclick="selectLocation('${State.location.state}', '${city}')" class="w-full text-left px-4 py-3 rounded-xl transition-colors text-[13px] ${State.location.city === city ? 'bg-brand-red/10 text-brand-red font-medium border border-brand-red/20' : 'hover:bg-white/5 text-white/70 border border-transparent'}">${city}</button>`;
                });
                cityList.innerHTML = citiesHTML;
            } else {
                // Sem estado (Nacional) - Step 1: Mostrar Estados
                citySection.classList.add('hidden');
                citySection.classList.remove('flex', 'h-full');

                stateSection.classList.remove('hidden', 'sm:flex');
                stateSection.classList.add('flex', 'w-full', 'h-full');
            }
            lucide.createIcons();
        }

        function openLocationModal() {
            const modal = document.getElementById('location-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            // Bloqueia Scroll da página enquanto escolhe a localização
            document.body.style.overflow = 'hidden';
            
            renderLocationModal();
        }

        function closeLocationModal() {
            const modal = document.getElementById('location-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            
            // Restaura o Scroll da página (mas mantém bloqueado se o menu de filtros mobile estiver aberto)
            if (!(State.isFiltersOpen && window.innerWidth < 640)) {
                document.body.style.overflow = '';
            }

        function clearStateSelection() {
            // Função do botão Voltar (Step 2 -> Step 1) no Mobile
            State.location.state = 'Nacional';
            State.location.city = 'Todas';
            renderLocationModal();
        }

        function pickState(uf) {
            State.location.state = uf;
            State.location.city = 'Todas'; 
            renderLocationModal();
        }

        function selectLocation(state, city) {
            State.location.state = state;
            State.location.city = city;

        // --- FUNÇÕES DE CRIAÇÃO DE HTML ---

        function createPostHTML(post, index = 0, isThreadReply = false) {

            const cursorClass = (State.view === 'feed' && !isThreadReply) ? 'cursor-pointer hover:bg-brand-card/60 hover:border-white/10 hover:shadow-lg hover:shadow-black/20' : '';

                            </div>

                            <span class="text-white/40">${post.time}</span>

                                <span class="text-white/20">•</span>
                                <span class="text-white/40 hidden sm:inline">${post.location}</span>
                            ` : ''}
                        </div>
                        ${!isThreadReply ? `
                            <div class="flex items-center gap-3 text-[12px] text-white/40">
                                <span class="flex items-center gap-1.5 bg-white/5 px-2.5 py-1 rounded-md">

                    <p class="post-content text-white/80 font-light whitespace-pre-wrap tracking-wide transition-all duration-500 text-[15px] sm:text-[16px] leading-relaxed">${textContent}</p>

                    ${post.image ? `
                        <div class="mt-6 rounded-2xl overflow-hidden border border-white/5 relative aspect-[21/9] sm:aspect-[21/7] bg-black/50">
                            <img src="${post.image}" alt="Ilustração da notícia" class="w-full h-full object-cover opacity-80 group-hover:opacity-100 transition-all duration-700 ${State.view === 'feed' ? 'group-hover:scale-105' : ''}" loading="lazy" />

                            <div onclick="${stopProp} toggleAudio('${post.id}')" class="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-white/5 border border-white/10 hover:bg-brand-red/10 hover:border-brand-red/20 transition-colors cursor-pointer group w-auto min-w-[80px] z-10">
                                <div id="audio-icon-${post.id}" class="flex items-center justify-center w-4">

                                             <div class="w-1 bg-brand-red rounded-full animate-pulse-fast h-full" style="animation-delay: 0.2s"></div>
                                           </div>`

                                </div>
                                <span class="text-[12px] font-medium text-white/50 group-hover:text-brand-red font-mono transition-colors">${post.audioLength}</span>
                                
                                <div id="audio-progress-wrapper-${post.id}" class="w-16 h-1 bg-white/10 rounded-full overflow-hidden ml-1 hidden sm:${State.audio.playingId === String(post.id) ? 'block' : 'hidden'}">

                                </div>

                            <button onclick="${stopProp} copyCitation('${post.id}', \`${post.citation}\`)" class="flex items-center gap-1.5 px-3 py-2 rounded-lg text-[12px] font-medium text-white/40 hover:text-white hover:bg-white/5 transition-colors group">
                                <i data-lucide="copy" class="w-3.5 h-3.5 group-hover:scale-110 transition-transform"></i>

        function renderFeedList() {
            const container = document.getElementById('feed-container');
            
            const filteredPosts = POSTS.filter(post => {
                const matchCategory = State.activeCategory === 'Recentes' || post.tags.includes(State.activeCategory);
                const matchLevel = State.activeLevel === 'Todos' || post.level.includes(State.activeLevel);
                const matchSearch = State.searchQuery === '' || 
                                    post.content.toLowerCase().includes(State.searchQuery.toLowerCase()) ||
                                    post.source.toLowerCase().includes(State.searchQuery.toLowerCase());
                
                // Filtro de Localização
                let matchLocation = true;
                if (State.location.state !== 'Nacional') {
                    matchLocation = post.location.includes(State.location.state) || post.location === 'Global' || post.location === 'Nacional';
                    
                    if (matchLocation && State.location.city !== 'Todas' && post.location !== 'Global' && post.location !== 'Nacional') {
                        matchLocation = post.location.includes(State.location.city);
                    }
                }

                return matchCategory && matchLevel && matchSearch && matchLocation;
            });

            if (filteredPosts.length === 0) {
                container.classList.remove('columns-1', 'md:columns-2', 'lg:columns-3');
                container.classList.add('flex', 'flex-col', 'items-center');
                
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center p-16 text-center text-white/40 fade-up-enter fade-up-enter-active">
                        <i data-lucide="inbox" class="w-12 h-12 mb-4 opacity-50"></i>
                        <p class="text-lg font-medium text-white/60">Nenhum resultado encontrado.</p>
                        <p class="text-sm mt-1">Tente ajustar os filtros ou a sua pesquisa.</p>
                        <button onclick="clearFilters()" class="mt-4 px-4 py-2 bg-white/5 hover:bg-white/10 rounded-lg text-sm transition-colors">Limpar Tudo</button>
                    </div>`;
                return;
            }

            container.classList.add('columns-1', 'md:columns-2', 'lg:columns-3');
            container.classList.remove('flex', 'flex-col', 'items-center');

            container.innerHTML = filteredPosts.map((post, index) => createPostHTML(post, index, false)).join('');
        }

        function renderSinglePost() {
            const container = document.getElementById('single-post-container');
            const post = POSTS.find(p => p.id === State.selectedPostId);
            
            if (!post) return;

            let html = createPostHTML(post, 0, false);

            if (post.thread && post.thread.length > 0) {
                html += `<div class="flex flex-col w-full relative">`;
                
                post.thread.forEach((reply, idx) => {
                    const isLast = idx === post.thread.length - 1;
                    html += `
                        <div class="flex w-full relative group">
                            <div class="w-10 sm:w-16 shrink-0 flex flex-col items-center relative">
                                <div class="w-[2px] bg-white/10 ${idx === 0 ? '-mt-6 h-[3.5rem]' : 'h-[2.5rem]'}"></div>
                                <div class="w-2.5 h-2.5 rounded-full bg-brand-dark border-2 border-brand-red z-10 relative">
                                    <div class="absolute top-1/2 left-[100%] w-[1.125rem] sm:w-[2.625rem] h-[2px] bg-white/10 -translate-y-1/2"></div>
                                </div>
                                ${!isLast ? `<div class="w-[2px] bg-white/10 flex-grow"></div>` : ''}
                            </div>
                            
                            <div class="flex-grow pt-4 pb-2 pr-0 sm:pr-8">
                                ${createPostHTML(reply, idx + 1, true)}
                            </div>
                        </div>
                    `;
                });
                
                html += `</div>`;
            }

            container.innerHTML = html;
        }

        // --- NAVEGAÇÃO E INTERATIVIDADE (URL Routing Additions) ---

        function openPost(id, skipHistory = false) {
            // Fecha a barra de pesquisa graciosamente
            if (State.isSearchOpen) {
                toggleSearch(); 
            }
            
            State.feedScrollPosition = window.scrollY; 
            State.view = 'post';
            State.selectedPostId = parseInt(id);
            
            // Adiciona ao histórico de navegação com Try-Catch para evitar bloqueios de iframe/blob
            if (!skipHistory) {
                try {
                    history.pushState({ view: 'post', id: State.selectedPostId }, '', '?post=' + State.selectedPostId);
                } catch (e) {
                    console.log('History API bloqueada pelo ambiente (blob/iframe). Navegação interna mantida.');
                }
            }

            window.scrollTo({ top: 0, behavior: 'instant' });
            renderApp();
        }

        function closePost(skipHistory = false) {
            State.view = 'feed';
            State.selectedPostId = null;
            
            // Limpa o URL e o histórico com Try-Catch para evitar bloqueios de iframe/blob
            if (!skipHistory) {
                try {
                    const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
                    history.pushState({ view: 'feed' }, '', cleanUrl);
                } catch (e) {
                    console.log('History API bloqueada pelo ambiente (blob/iframe). Navegação interna mantida.');
                }
            }

            renderApp();
            
            setTimeout(() => {
                window.scrollTo({ top: State.feedScrollPosition, behavior: 'instant' });
            }, 10);
        }

        // Evento que deteta os botões Back/Forward do Browser
        window.addEventListener('popstate', (e) => {
            const urlParams = new URLSearchParams(window.location.search);
            const postId = urlParams.get('post');
            
            if (postId) {
                State.view = 'post';
                State.selectedPostId = parseInt(postId);
                window.scrollTo({ top: 0, behavior: 'instant' });
                renderApp();
            } else {
                State.view = 'feed';
                State.selectedPostId = null;
                renderApp();
                setTimeout(() => {
                    window.scrollTo({ top: State.feedScrollPosition, behavior: 'instant' });
                }, 10);
            }
        });

        function scrollCategories(amount) {
            const container = document.getElementById('categories-scroll-wrapper');
            container.scrollBy({ left: amount, behavior: 'smooth' });
        }

        function highlightSearch(text, query) {
            if (!query) return text;
            const regex = new RegExp(`(${query})`, 'gi');
            return text.replace(regex, '<span class="bg-brand-red/20 text-brand-red px-1 rounded">$1</span>');
        }

        function setActiveCategory(cat) {
            State.activeCategory = cat;
            renderCategories(); // Atualiza a cor de ativo nos botões
            if (State.view !== 'feed') closePost();
            else renderApp();
        }

        function setActiveLevel(nivel) {
            State.activeLevel = nivel;
            renderLevels(); // Atualiza a cor de ativo nos botões
            if (State.view !== 'feed') closePost();
            else renderApp();
        }

        function clearFilters() {
            State.activeCategory = 'Recentes';
            State.activeLevel = 'Todos';
            State.searchQuery = '';
            document.getElementById('search-input').value = '';
            
            State.location.state = 'Nacional';
            State.location.city = 'Todas';
            document.getElementById('location-btn-text').innerText = 'Nacional';
            if(document.getElementById('mobile-location-btn-text')) {
                document.getElementById('mobile-location-btn-text').innerText = 'Nacional';
            }
            
            renderCategories();
            renderLevels();
            renderApp();
        }

        function toggleFilters() {
            State.isFiltersOpen = !State.isFiltersOpen;
            const desktopFilters = document.getElementById('filters-container');
            const mobileOverlay = document.getElementById('mobile-filters-overlay');
            const mobileSheet = document.getElementById('mobile-filters-sheet');
            const icon = document.getElementById('filter-toggle-icon');

            if (State.isFiltersOpen) {
                icon.classList.add('text-brand-red');
                
                // Desktop Toggle
                desktopFilters.classList.remove('hidden');
                desktopFilters.classList.add('flex');
                setTimeout(() => {
                    desktopFilters.classList.remove('opacity-0', '-translate-y-4');
                    desktopFilters.classList.add('opacity-100', 'translate-y-0');
                }, 10);

                // Mobile Toggle
                mobileOverlay.classList.remove('hidden');
                mobileSheet.classList.remove('hidden');
                mobileSheet.classList.add('flex');
                
                if (window.innerWidth < 640) document.body.style.overflow = 'hidden';

                setTimeout(() => {
                    mobileOverlay.classList.remove('opacity-0');
                    mobileOverlay.classList.add('opacity-100');
                    mobileSheet.classList.remove('translate-y-full');
                    mobileSheet.classList.add('translate-y-0');
                }, 10);

            } else {
                icon.classList.remove('text-brand-red');
                
                // Desktop Toggle
                desktopFilters.classList.add('opacity-0', '-translate-y-4');
                desktopFilters.classList.remove('opacity-100', 'translate-y-0');
                
                // Mobile Toggle
                mobileOverlay.classList.add('opacity-0');
                mobileOverlay.classList.remove('opacity-100');
                mobileSheet.classList.add('translate-y-full');
                mobileSheet.classList.remove('translate-y-0');

                document.body.style.overflow = '';

                setTimeout(() => {
                    desktopFilters.classList.add('hidden');
                    desktopFilters.classList.remove('flex');
                    mobileOverlay.classList.add('hidden');
                    mobileSheet.classList.add('hidden');
                    mobileSheet.classList.remove('flex');
                }, 300);
            }
        }

        function toggleSearch() {
            State.isSearchOpen = !State.isSearchOpen;
            const searchBar = document.getElementById('search-bar');
            const searchInput = document.getElementById('search-input');
            const headerFeed = document.getElementById('header-feed'); // Acesso à header padrão

            if (State.isSearchOpen) {
                // Expande a barra de pesquisa
                searchBar.classList.remove('opacity-0', 'pointer-events-none', 'scale-95');
                searchBar.classList.add('opacity-100', 'scale-100', 'z-30');
                
                // Esconde todo o conteúdo da Header (Perfil e Botões) suavemente
                headerFeed.classList.add('opacity-0', 'pointer-events-none');
                headerFeed.classList.remove('opacity-100');
                
                setTimeout(() => searchInput.focus(), 100);
            } else {
                // Recolhe a barra de pesquisa
                searchBar.classList.add('opacity-0', 'pointer-events-none', 'scale-95');
                searchBar.classList.remove('opacity-100', 'scale-100', 'z-30');
                
                // Traz o conteúdo da Header de volta à vida
                headerFeed.classList.remove('opacity-0', 'pointer-events-none');
                headerFeed.classList.add('opacity-100');
                
                if (State.searchQuery !== '') {
                    State.searchQuery = '';
                    searchInput.value = '';
                    renderApp();
                }
            }
        }

        document.getElementById('search-input').addEventListener('input', (e) => {
            State.searchQuery = e.target.value;
            if (State.view === 'post') closePost(); 
            else renderApp();
        });

        // Toggle Audio
        function toggleAudio(id) {
            const stringId = String(id); 

            const resetAudioUI = (audioId) => {
                const icon = document.getElementById(`audio-icon-${audioId}`);
                const wrapper = document.getElementById(`audio-progress-wrapper-${audioId}`);
                const progress = document.getElementById(`audio-progress-${audioId}`);
                
                if (icon) {
                    icon.innerHTML = `<i data-lucide="play" class="w-3.5 h-3.5 text-white/50 group-hover:text-brand-red fill-transparent group-hover:fill-brand-red/20 transition-all"></i>`;
                }
                if (wrapper) {
                    wrapper.classList.add('hidden');
                    wrapper.classList.remove('sm:block');
                }
                if (progress) progress.style.width = '0%';
            };

            const setPlayingUI = (audioId) => {
                const icon = document.getElementById(`audio-icon-${audioId}`);
                const wrapper = document.getElementById(`audio-progress-wrapper-${audioId}`);
                
                if (icon) {
                    icon.innerHTML = `<div class="flex gap-[2px] h-3 items-end">
                         <div class="w-1 bg-brand-red rounded-full animate-pulse-fast h-full"></div>
                         <div class="w-1 bg-brand-red rounded-full animate-pulse-fast h-2/3" style="animation-delay: 0.1s"></div>
                         <div class="w-1 bg-brand-red rounded-full animate-pulse-fast h-full" style="animation-delay: 0.2s"></div>
                       </div>`;
                }
                if (wrapper) {
                    wrapper.classList.remove('hidden');
                    wrapper.classList.add('sm:block');
                }
            };

            if (State.audio.interval) {
                clearInterval(State.audio.interval);
                State.audio.interval = null;
            }

            if (State.audio.playingId === stringId) {
                resetAudioUI(State.audio.playingId);
                State.audio.playingId = null;
                State.audio.progress = 0;
                lucide.createIcons();
            } else {
                if (State.audio.playingId !== null) {
                    resetAudioUI(State.audio.playingId);
                }

                State.audio.playingId = stringId;
                State.audio.progress = 0;
                
                setPlayingUI(stringId);

                State.audio.interval = setInterval(() => {
                    State.audio.progress += 0.5;
                    const progressBar = document.getElementById(`audio-progress-${stringId}`);
                    
                    if (progressBar) {
                        progressBar.style.width = `${State.audio.progress}%`;
                    }

                    if (State.audio.progress >= 100) {
                        clearInterval(State.audio.interval);
                        State.audio.interval = null;
                        resetAudioUI(stringId);
                        State.audio.playingId = null;
                        State.audio.progress = 0;
                        lucide.createIcons();
                    }
                }, 100);
            }
        }

        function copyCitation(id, text) {
            const textarea = document.createElement("textarea");
            textarea.value = text;
            textarea.style.position = "fixed";
            textarea.style.opacity = "0";
            document.body.appendChild(textarea);
            textarea.select();
            
            try {
                document.execCommand('copy');
                const citeText = document.getElementById(`cite-text-${id}`);
                const icon = citeText.previousElementSibling;
                
                if (citeText) {
                    citeText.innerText = "Copiado!";
                    citeText.classList.add("text-brand-red");
                    icon.setAttribute('data-lucide', 'check');
                    icon.classList.add("text-brand-red");
                    lucide.createIcons();
                    
                    setTimeout(() => {
                        citeText.innerText = "Citar";
                        citeText.classList.remove("text-brand-red");
                        icon.setAttribute('data-lucide', 'copy');
                        icon.classList.remove("text-brand-red");
                        lucide.createIcons();
                    }, 2000);
                }
            } catch (err) {
                console.error("Falha ao copiar:", err);
            } finally {
                document.body.removeChild(textarea);
            }
        }

        // --- COMPORTAMENTO DE SCROLL (AUTO-HIDE FILTERS DESKTOP) ---
        let scrollTimeout;
        const desktopFiltersContainer = document.getElementById('filters-container');

        window.addEventListener('scroll', () => {
            if (State.view === 'post' || !State.isFiltersOpen || window.innerWidth < 640) return;

            const currentScrollY = window.scrollY;
            
            if (currentScrollY > 100) {
                desktopFiltersContainer.classList.add('opacity-0', '-translate-y-4');
                desktopFiltersContainer.classList.remove('opacity-100', 'translate-y-0');
                
                clearTimeout(scrollTimeout);
                
                scrollTimeout = setTimeout(() => {
                    if(State.isFiltersOpen) {
                        desktopFiltersContainer.classList.remove('opacity-0', '-translate-y-4');
                        desktopFiltersContainer.classList.add('opacity-100', 'translate-y-0');
                    }
                }, 300);
            } else {
                desktopFiltersContainer.classList.remove('opacity-0', '-translate-y-4');
                desktopFiltersContainer.classList.add('opacity-100', 'translate-y-0');
                clearTimeout(scrollTimeout);
            }
        }, { passive: true });

        // --- INICIALIZAÇÃO ---
        window.onload = () => {
            renderCategories();
            renderLevels();
            
            // Verifica no URL se o utilizador abriu um Post especificamente
            const urlParams = new URLSearchParams(window.location.search);
            const postId = urlParams.get('post');
            
            if (postId) {
                State.view = 'post';
                State.selectedPostId = parseInt(postId);
            }
            
            renderApp();
        };

    </script>
</body>
</html>
